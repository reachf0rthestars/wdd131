<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Productivity Timer</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="logo">Productivity Time!</div>
    <nav class="main-nav">
      <a href="index.html">How It Works</a>
      <a href="timer.html" class="active">Timer</a>
    </nav>
  </header>

  <main class="work-area">

    <div class="timer-panel">
      <div class='timer-text'><h2>Session Timer</h2><h4> - (in mineuts)</h4></div>
      <div class="timer-display">
        <div class="timer-form">
          <input type="text" value="25" />
        </div>
      </div>
      <div class="timer-controls">
      <button class="btn-secondary startbtn" type="button">Start</button>
      <button class="btn-secondary pausebtn" type="button">Pause</button>
      </div>
    </div>

    <div class="tasks-panel">
      <h2>Task List</h2>

      <form class="task-form ">
        <input type="text" placeholder="Add a new task..." />
        <button type="submit" class="btn-primary taskbtn">Add</button>
      </form>

      <ul class="task-list">
        <!-- <li>
          <span>Example task: Finish report</span>
          <button class="remove-task">✕</button>
        </li>
        <li>
          <span>Example task: Reply to emails</span>
          <button class="remove-task">✕</button>
        </li> -->
      </ul>
    </div>

  </main>

  <footer class="site-footer">
    <p>2026 Productivity Time</p>
  </footer>
</body>
</html>
